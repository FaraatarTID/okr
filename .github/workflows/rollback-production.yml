name: Roll back production release

on:
  workflow_dispatch:
    inputs:
      previous_release_sha:
        description: Full commit SHA represented by the previous known-good manifest
        required: true
        type: string
      manifest_run_id:
        description: GitHub Actions run ID that produced the previous release manifest
        required: true
        type: string
      incident_reference:
        description: Incident, ticket, or operator reference for this rollback
        required: false
        default: not-provided
        type: string

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: production-rollback
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ inputs.previous_release_sha }}

jobs:
  verify-previous-release:
    name: Verify previous release signatures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release policy
        uses: actions/checkout@v6

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify Cosign installation
        run: cosign version

      - name: Download previous release manifest
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.manifest_run_id }}
          name: ghcr-release-manifest-${{ inputs.previous_release_sha }}
          path: release-manifest

      - name: Verify manifest identity
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f release-manifest/release-manifest.json
          jq -e --arg sha "$RELEASE_SHA" --arg repository "$REPOSITORY" \
            '.schema_version == 1 and .repository == $repository and .commit_sha == $sha and ($sha | test("^[0-9a-f]{40}$")) and (.images | keys | sort == ["backend", "bff", "web"])' \
            release-manifest/release-manifest.json >/dev/null

      # Signature verification runs before the evidence contract, not after it: the
      # contract requires the verified image@digest references that this step produces,
      # because the verifier will not accept an unproven digest list.
      - name: Verify every previous release signature
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          issuer="https://token.actions.githubusercontent.com"
          identity="^https://github.com/${REPOSITORY}/.github/workflows/publish-ghcr.yml@refs/heads/(main|master)$"
          : > cosign-references.txt
          jq -r '.images[] | [.image, .digest] | @tsv' release-manifest/release-manifest.json | while IFS=$'\t' read -r image digest; do
            test "$image" = "${image%:*}:${RELEASE_SHA}"
            test "$digest" = sha256:*
            cosign verify \
              --certificate-oidc-issuer "$issuer" \
              --certificate-identity-regexp "$identity" \
              "${image}@${digest}"
            printf '%s@%s\n' "$image" "$digest" >> cosign-references.txt
          done
          test "$(wc -l < cosign-references.txt)" -eq 3

      - name: Validate rollback evidence contract
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          references=()
          while IFS= read -r reference; do
            references+=(--cosign-reference "$reference")
          done < cosign-references.txt
          python scripts/verify_rollback_evidence.py \
            --manifest release-manifest/release-manifest.json \
            --commit-sha "$RELEASE_SHA" \
            --repository "$REPOSITORY" \
            "${references[@]}" \
            --output rollback-verification.json

      - name: Write signature verification summary
        run: |
          {
            echo "## Previous release verified for rollback"
            echo "- Release: \`$RELEASE_SHA\`"
            echo "- Manifest run: \`${{ inputs.manifest_run_id }}\`"
            echo "- Cosign verification: passed"
          } >> "$GITHUB_STEP_SUMMARY"

  approve-and-prepare:
    name: Approve and prepare production rollback
    runs-on: ubuntu-latest
    needs: verify-previous-release
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout rollback tools
        uses: actions/checkout@v6

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download verified previous release manifest
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.manifest_run_id }}
          name: ghcr-release-manifest-${{ inputs.previous_release_sha }}
          path: release-manifest

      # "Revalidate" means re-verify here rather than trust the earlier job's output.
      # This job runs behind the production environment approval, so it establishes the
      # signatures and the evidence contract for itself.
      - name: Revalidate every previous release signature
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          issuer="https://token.actions.githubusercontent.com"
          identity="^https://github.com/${REPOSITORY}/.github/workflows/publish-ghcr.yml@refs/heads/(main|master)$"
          : > cosign-references.txt
          jq -r '.images[] | [.image, .digest] | @tsv' release-manifest/release-manifest.json | while IFS=$'\t' read -r image digest; do
            test "$image" = "${image%:*}:${RELEASE_SHA}"
            test "$digest" = sha256:*
            cosign verify \
              --certificate-oidc-issuer "$issuer" \
              --certificate-identity-regexp "$identity" \
              "${image}@${digest}"
            printf '%s@%s\n' "$image" "$digest" >> cosign-references.txt
          done
          test "$(wc -l < cosign-references.txt)" -eq 3

      - name: Revalidate rollback evidence contract
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          references=()
          while IFS= read -r reference; do
            references+=(--cosign-reference "$reference")
          done < cosign-references.txt
          python scripts/verify_rollback_evidence.py \
            --manifest release-manifest/release-manifest.json \
            --commit-sha "$RELEASE_SHA" \
            --repository "$REPOSITORY" \
            "${references[@]}" \
            --output rollback-verification.json

      - name: Write digest-pinned rollback record
        env:
          INCIDENT_REFERENCE: ${{ inputs.incident_reference }}
        run: |
          set -euo pipefail
          jq \
            --arg action "rollback" \
            --arg approved_by "${GITHUB_ACTOR}" \
            --arg approved_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg manifest_run_id "${{ inputs.manifest_run_id }}" \
            --arg incident_reference "$INCIDENT_REFERENCE" \
            --rawfile cosign_references cosign-references.txt \
            '. + {rollback: $action, rollback_from_manifest_run_id: $manifest_run_id, incident_reference: $incident_reference, approved_by: $approved_by, approved_at: $approved_at, cosign_references: ($cosign_references | split("\n") | map(select(length > 0)))}' \
            release-manifest/release-manifest.json > production-rollback.json

      # No signing step, deliberately. A6c removed the record attestation because this
      # run both signed the record and then verified its own signature with the same
      # shared key, so it could not distinguish an honest record from a forgery produced
      # by this run. The Cosign references verified above are what bind the record to
      # real published images.
      - name: Validate pre-deployment rollback approval contract
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/verify_rollback_evidence.py \
            --approval production-rollback.json \
            --commit-sha "$RELEASE_SHA" \
            --repository "$REPOSITORY" \
            --output rollback-approval-verification.json

      - name: Write rollback approval summary
        run: |
          {
            echo "## Production rollback approved"
            echo "- Restored release: \`$RELEASE_SHA\`"
            echo "- Manifest run: \`${{ inputs.manifest_run_id }}\`"
            echo "- Cosign verification: passed"
            echo "- Production environment approval: granted"
            echo "- Darkube action: manually deploy the digests in \`production-rollback.json\`"
            echo "- Required next step: after the deployment, run the \`rollback-execution-verification\` workflow with this run's ID and the provider's execution outcome"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production rollback record
        uses: actions/upload-artifact@v7
        with:
          name: production-rollback-${{ inputs.previous_release_sha }}
          path: |
            production-rollback.json
            rollback-verification.json
            rollback-approval-verification.json
          retention-days: 90
