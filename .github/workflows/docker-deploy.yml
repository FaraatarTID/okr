name: Build and deploy OKR

# Changelog note:
# - Uses .github/actions/setup-python-dependencies to keep CI contract/check gates aligned with runtime/test dependencies.
#   to keep offline contract gates aligned with CI/runtime dependency expectations.

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'README.md'
      - 'DEPLOYMENT.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        uses: astral-sh/setup-uv@v6

      - name: Sync Python workspace
        run: |
          uv sync --locked --group dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Insert Payload Schema Contract Gate (offline)
        run: python scripts/check_insert_contract.py --from-baseline

      - name: Verify dependency authority and compatibility export
        run: |
          python scripts/export_requirements.py --check
          python scripts/check_dependency_manifest.py

      - name: Compute image tag (lowercase)
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}

  deploy-compose:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    needs: build
    runs-on: ubuntu-latest
    env:
      ENABLE_SSH_DEPLOY: ${{ secrets.ENABLE_SSH_DEPLOY || vars.ENABLE_SSH_DEPLOY || 'false' }}
      DEPLOY_HOST: ${{ secrets.SSH_HOST || secrets.DEPLOY_HOST || secrets.HOST }}
      DEPLOY_USER: ${{ secrets.SSH_USER || secrets.DEPLOY_USER || secrets.USERNAME }}
      DEPLOY_KEY: ${{ secrets.SSH_KEY || secrets.DEPLOY_KEY }}
      DEPLOY_DIR: ${{ secrets.REMOTE_DEPLOY_DIR || secrets.DEPLOY_DIR }}
      RELEASE_BACKEND_IMAGE: ${{ needs.build.outputs.image }}
      RELEASE_BFF_IMAGE: ${{ secrets.RELEASE_BFF_IMAGE || vars.RELEASE_BFF_IMAGE }}
      RELEASE_WEB_IMAGE: ${{ secrets.RELEASE_WEB_IMAGE || vars.RELEASE_WEB_IMAGE }}
    steps:
      - name: Validate deploy secrets
        id: validate
        run: |
          set -e
          if [ "${ENABLE_SSH_DEPLOY,,}" != "true" ]; then
            echo "::notice::Skipping SSH deploy because ENABLE_SSH_DEPLOY is not true."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          [ -z "${DEPLOY_HOST}" ] && missing="${missing} DEPLOY_HOST(SSH_HOST/DEPLOY_HOST/HOST)"
          [ -z "${DEPLOY_USER}" ] && missing="${missing} DEPLOY_USER(SSH_USER/DEPLOY_USER/USERNAME)"
          [ -z "${DEPLOY_KEY}" ] && missing="${missing} DEPLOY_KEY(SSH_KEY/DEPLOY_KEY)"
          [ -z "${DEPLOY_DIR}" ] && missing="${missing} DEPLOY_DIR(REMOTE_DEPLOY_DIR/DEPLOY_DIR)"
          [ -z "${RELEASE_BFF_IMAGE}" ] && missing="${missing} RELEASE_BFF_IMAGE"
          [ -z "${RELEASE_WEB_IMAGE}" ] && missing="${missing} RELEASE_WEB_IMAGE"
          if [ -n "${missing}" ]; then
            echo "::notice::Skipping SSH deploy. Missing:${missing}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          validate_immutable_image() {
            if [[ ! "$1" =~ ^[^[:space:]]+@sha256:[0-9a-fA-F]{64}$ ]]; then
              echo "::error::${2} must be an immutable image reference ending in @sha256:<64-hex-digest>."
              return 1
            fi
          }
          validate_immutable_image "${RELEASE_BACKEND_IMAGE}" RELEASE_BACKEND_IMAGE
          validate_immutable_image "${RELEASE_BFF_IMAGE}" RELEASE_BFF_IMAGE
          validate_immutable_image "${RELEASE_WEB_IMAGE}" RELEASE_WEB_IMAGE
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to server via SSH (Docker Compose)
        if: steps.validate.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          envs: RELEASE_BACKEND_IMAGE,RELEASE_BFF_IMAGE,RELEASE_WEB_IMAGE
          script: |
            set -e
            cd ${{ env.DEPLOY_DIR }}
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            OKR_RELEASE_BACKEND_IMAGE="${RELEASE_BACKEND_IMAGE}" \
            OKR_RELEASE_BFF_IMAGE="${RELEASE_BFF_IMAGE}" \
            OKR_RELEASE_WEB_IMAGE="${RELEASE_WEB_IMAGE}" \
              docker compose -f deploy/docker/docker-compose.yml -f deploy/docker/docker-compose.release.yml pull
            OKR_RELEASE_BACKEND_IMAGE="${RELEASE_BACKEND_IMAGE}" \
            OKR_RELEASE_BFF_IMAGE="${RELEASE_BFF_IMAGE}" \
            OKR_RELEASE_WEB_IMAGE="${RELEASE_WEB_IMAGE}" \
              docker compose -f deploy/docker/docker-compose.yml -f deploy/docker/docker-compose.release.yml up -d --no-build

            BACKEND_HOST_PORT="$(python3 scripts/read_env_value.py deploy/docker/.env OKR_BACKEND_HOST_PORT)"
            BFF_HOST_PORT="$(python3 scripts/read_env_value.py deploy/docker/.env SPA_BFF_HOST_PORT)"
            SPA_WEB_HOST_PORT="$(python3 scripts/read_env_value.py deploy/docker/.env SPA_WEB_HOST_PORT)"
            BACKEND_HOST_PORT="${BACKEND_HOST_PORT:-8100}"
            BFF_HOST_PORT="${BFF_HOST_PORT:-3001}"
            SPA_WEB_HOST_PORT="${SPA_WEB_HOST_PORT:-3000}"

            python3 scripts/verify_deploy_readiness.py \
              --backend-health-url "http://127.0.0.1:${BACKEND_HOST_PORT}/healthz" \
              --bff-health-url "http://127.0.0.1:${BFF_HOST_PORT}/healthz" \
              --web-url "http://127.0.0.1:${SPA_WEB_HOST_PORT}/" \
              --compose-file deploy/docker/docker-compose.yml \
              --timeout-seconds 300

      - name: Deploy skipped
        if: steps.validate.outputs.ready != 'true'
        run: echo "SSH deploy skipped; set ENABLE_SSH_DEPLOY=true and required deploy secrets to enable it."
