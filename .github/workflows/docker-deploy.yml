name: Build and deploy OKR Streamlit

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute image tag (lowercase)
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}

  deploy-compose:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    needs: build
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.SSH_HOST || secrets.DEPLOY_HOST || secrets.HOST }}
      DEPLOY_USER: ${{ secrets.SSH_USER || secrets.DEPLOY_USER || secrets.USERNAME }}
      DEPLOY_KEY: ${{ secrets.SSH_KEY || secrets.DEPLOY_KEY }}
      DEPLOY_DIR: ${{ secrets.REMOTE_DEPLOY_DIR || secrets.DEPLOY_DIR }}
    steps:
      - name: Validate deploy secrets
        id: validate
        run: |
          set -e
          missing=""
          [ -z "${DEPLOY_HOST}" ] && missing="${missing} DEPLOY_HOST(SSH_HOST/DEPLOY_HOST/HOST)"
          [ -z "${DEPLOY_USER}" ] && missing="${missing} DEPLOY_USER(SSH_USER/DEPLOY_USER/USERNAME)"
          [ -z "${DEPLOY_KEY}" ] && missing="${missing} DEPLOY_KEY(SSH_KEY/DEPLOY_KEY)"
          [ -z "${DEPLOY_DIR}" ] && missing="${missing} DEPLOY_DIR(REMOTE_DEPLOY_DIR/DEPLOY_DIR)"
          if [ -n "${missing}" ]; then
            echo "::notice::Skipping SSH deploy (expected for Streamlit Cloud). Missing:${missing}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to server via SSH (Docker Compose)
        if: steps.validate.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          script: |
            set -e
            cd ${{ env.DEPLOY_DIR }}
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            IMAGE=${{ needs.build.outputs.image }} docker compose -f deploy/docker/docker-compose.yml pull
            IMAGE=${{ needs.build.outputs.image }} docker compose -f deploy/docker/docker-compose.yml up -d --build

      - name: Deploy skipped
        if: steps.validate.outputs.ready != 'true'
        run: echo "SSH deploy skipped; Streamlit Cloud deployment does not require this step."
