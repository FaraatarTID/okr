name: Cosign toolchain health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions: {}

jobs:
  installer:
    name: Verify pinned Cosign installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Named "with retries" until 2026-09-21, when the claim was found to be false:
      # `curl-retries` is not an input this action accepts, so no retry ever occurred.
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Verify installed version
        run: |
          set -euo pipefail
          cosign version
