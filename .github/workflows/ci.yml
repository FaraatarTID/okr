name: ci

# Changelog note:
# - Uses .github/actions/setup-python-dependencies to keep CI contract/check gates aligned with runtime/test dependencies.
#   to keep contract/check jobs aligned with shared runtime/test requirements.

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - Pure-SPA-BFF
      - SPA-BFF-clean

jobs:
  changes:
    name: Classify changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
      unclassified: ${{ steps.filter.outputs.unclassified }}
    steps:
      - uses: actions/checkout@v6
      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend_app/**'
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'backend_app/requirements.txt'
              - 'alembic.ini'
              - 'alembic/**'
            frontend:
              - 'spa-web/**'
              - 'spa-bff/**'
              - 'package.json'
              - 'package-lock.json'
            shared:
              - '.github/**'
              - 'deploy/**'
              - 'docs/**'
              - 'README.md'
              - 'DEPLOYMENT.md'
              - 'justfile'
              - 'pyproject.toml'
              - 'uv.lock'
            unclassified:
              - '**'
              - '!backend_app/**'
              - '!src/**'
              - '!tests/**'
              - '!scripts/**'
              - '!backend_app/requirements.txt'
              - '!alembic.ini'
              - '!alembic/**'
              - '!spa-web/**'
              - '!spa-bff/**'
              - '!package.json'
              - '!package-lock.json'
              - '!.github/**'
              - '!deploy/**'
              - '!docs/**'
              - '!README.md'
              - '!DEPLOYMENT.md'
              - '!justfile'
              - '!pyproject.toml'
              - '!uv.lock'

  rls-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.unclassified == 'true' }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: okr
          POSTGRES_PASSWORD: okr
          POSTGRES_DB: okr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U okr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      OKR_DATABASE_URL: postgresql+psycopg2://okr:okr@localhost:5432/okr
      OKR_ALLOW_NON_SUPABASE_DB: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend_app/requirements.txt

      - name: Install Python dependencies
        # Uses .github/actions/setup-python-dependencies to keep CI contract/check gates aligned with runtime/test dependencies.
        uses: ./.github/actions/setup-python-dependencies
        with:
          requirements-path: backend_app/requirements.txt

      - name: Migration Lint Gate
        run: python scripts/verify_migration_lint.py --require-baseline

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: RLS Coverage Gate
        run: python scripts/check_rls_enabled.py

  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.unclassified == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend_app/requirements.txt

      - name: Install Python dependencies
        uses: astral-sh/setup-uv@v6

      - name: Sync Python workspace
        run: |
          uv sync --locked --group dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Python security tooling
        run: uv pip install --python "$GITHUB_WORKSPACE/.venv/bin/python" pip-audit

      - name: Install Python license tooling
        run: uv pip install --python "$GITHUB_WORKSPACE/.venv/bin/python" pip-licenses

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Docs HQ Link Check
        run: python scripts/check_docs_hq_links.py

      - name: CI Script Reference Gate
        run: python scripts/check_ci_script_references.py

      - name: Import Boundary Gate
        run: python scripts/check_import_boundaries.py

      - name: SPA BFF TypeScript Boundary Gate
        run: python scripts/check_spa_bff_boundaries.py

      - name: Deployment Topology Gate
        run: python scripts/check_deployment_topology.py

      - name: OpenAPI Drift Gate
        run: python scripts/check_openapi_drift.py

      - name: BFF Allowlist Drift Gate
        run: python scripts/generate_bff_allowlist.py --check

      - name: Deploy Config Template Gate
        run: python scripts/check_deploy_config.py --mode template

      - name: Deploy Runtime Integration Matrix Gate
        run: python scripts/check_deploy_runtime_matrix.py --require-docker

      - name: Quality Baseline Expiry Gate
        run: python scripts/check_quality_gate_baseline.py

      - name: Insert Payload Schema Contract Gate (offline)
        run: python scripts/check_insert_contract.py --from-baseline

      - name: Dependency Vulnerability Scan
        run: python scripts/verify_dependency_scans.py

      - name: Dependency License Compliance
        run: python scripts/verify_dependency_licenses.py

      - name: Lint (Ruff)
        run: |
          python -m ruff check \
            backend_app \
            scripts \
            tests \
            --select E9,F63,F7,F82

      - name: Helper Integrity Gate
        run: python scripts/verify_helper_integrity.py

      - name: Secret Hygiene Gate
        run: python scripts/verify_secret_hygiene.py

      - name: Module Export Contract Gate
        run: python scripts/verify_module_export_contracts.py

      - name: Module Design Efficiency Gate
        run: python scripts/verify_module_design_efficiency.py

      - name: Duplication Check (JSCPD <= 1%)
        run: |
          npx -y jscpd@4.0.5 \
            --min-lines 20 \
            --min-tokens 120 \
            --threshold 1 \
            --reporters console \
            --ignore "**/__pycache__/**,**/.git/**,**/.venv/**,**/venv/**,**/.pytest_cache/**" \
            backend_app tests

      - name: Type Check (Mypy)
        run: |
          python -m mypy --ignore-missing-imports --follow-imports=skip \
            scripts \
            backend_app/config.py \
            backend_app/worker.py \
            backend_app/run_api.py \
            backend_app/path_setup.py

      - name: RBAC Regression Gate
        run: |
          python -m pytest -q \
            tests/test_crud_authorization.py \
            tests/test_rbac_permissions.py \
            tests/test_alignment_dag.py

      - name: Python Test Suite
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=pytest-results.xml || {
            echo "Initial pytest run failed. Re-running with verbose diagnostics..."
            python -m pytest -vv -ra --tb=long --full-trace --durations=50 --maxfail=1
            exit 1
          }

      - name: Container Image Build Gate
        run: |
          docker build \
            --file spa-web/Dockerfile \
            --tag okr-ci-web:${GITHUB_SHA} \
            .
          docker build \
            --file spa-bff/Dockerfile \
            --tag okr-ci-bff:${GITHUB_SHA} \
            .
          docker build \
            --file deploy/docker/Dockerfile \
            --tag okr-ci-backend:${GITHUB_SHA} \
            .

      - name: Full-stack Compose Smoke
        run: |
          python scripts/verify_resilience.py --compose-smoke

      - name: PostgreSQL Integration Profile
        run: |
          python scripts/verify_postgresql_integration.py --ensure-docker-service

      - name: Upload Pytest Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: ignore

  spa-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.unclassified == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json

      - name: Install JavaScript workspace dependencies
        run: npm ci --include=optional

      - name: OpenAPI generated types freshness gate
        run: npm --prefix spa-web run check:gen:api

      - name: BFF OpenAPI generated types freshness gate
        run: npm --prefix spa-bff run check:gen:api

      - name: Restore JavaScript build caches
        id: spa-build-cache
        uses: actions/cache@v6
        with:
          path: |
            spa-web/.next/cache
            spa-bff/.cache
          key: ${{ runner.os }}-spa-build-${{ hashFiles('package-lock.json', 'spa-bff/**/*.ts', 'spa-bff/tsconfig.json', 'spa-web/**/*.ts', 'spa-web/**/*.tsx', 'spa-web/next.config.*') }}
          restore-keys: |
            ${{ runner.os }}-spa-build-

      - name: SPA BFF allowlist drift gate
        run: npm --prefix spa-bff run check:allowlist

      - name: SPA BFF tests
        run: npm --prefix spa-bff test

      - name: SPA BFF build
        run: npm --prefix spa-bff run build

      - name: SPA Web build
        run: npm run build --workspace spa-web

      - name: SPA Web typecheck
        run: npm run typecheck --workspace spa-web

      - name: SPA Web tests
        run: npm run test --workspace spa-web

      - name: SPA Web coverage gate
        run: npm run test:coverage --workspace spa-web

      - name: Report JavaScript cache result
        if: always()
        run: |
          echo "### JavaScript build cache" >> "$GITHUB_STEP_SUMMARY"
          echo "Cache hit: `${{ steps.spa-build-cache.outputs.cache-hit || 'false' }}`" >> "$GITHUB_STEP_SUMMARY"

  spa-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - spa-quality
      - changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.unclassified == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend_app/requirements.txt

      - name: Install Python dependencies
        uses: astral-sh/setup-uv@v6

      - name: Sync Python workspace
        run: |
          uv sync --locked --group dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json

      - name: Install SPA dependencies
        run: npm ci --include=optional

      - name: Install Playwright Browser (Chromium)
        run: |
          set -o pipefail
          python -m playwright install chromium 2>&1 | tee playwright-install.log || {
            echo "Playwright browser install failed. Collecting diagnostics..."
            python --version || true
            python -m pip --version || true
            python -m pip show playwright || true
            python -m pip list | grep -i playwright || true
            uname -a || true
            exit 1
          }

      - name: SPA E2E Test (Playwright)
        env:
          OKR_RUN_PLAYWRIGHT_SPA_E2E: "1"
        run: |
          python -m pytest -q tests/test_e2e_playwright_spa_login_to_atlas.py --junitxml=pytest-spa-e2e-results.xml

      - name: Upload SPA E2E Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spa-e2e-results
          path: |
            pytest-spa-e2e-results.xml
            playwright-install.log
          if-no-files-found: ignore

  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - rls-gate
      - backend-quality
      - spa-quality
      - spa-e2e
    steps:
      - name: Require all executed checks to pass
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RLS_RESULT: ${{ needs.rls-gate.result }}
          BACKEND_RESULT: ${{ needs.backend-quality.result }}
          SPA_RESULT: ${{ needs.spa-quality.result }}
          E2E_RESULT: ${{ needs.spa-e2e.result }}
        run: |
          set -euo pipefail
          for result in "$CHANGES_RESULT" "$RLS_RESULT" "$BACKEND_RESULT" "$SPA_RESULT" "$E2E_RESULT"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "CI result failed because a required job returned: $result"
              exit 1
            fi
          done
          echo "CI result passed; intentionally skipped matrix jobs are neutral."
