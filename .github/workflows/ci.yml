name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - Pure-SPA-BFF

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend_app/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend_app/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Docs HQ Link Check
        run: python scripts/check_docs_hq_links.py

      - name: Deploy Config Template Gate
        run: python scripts/check_deploy_config.py --mode template

      - name: Quality Baseline Expiry Gate
        run: python scripts/check_quality_gate_baseline.py

      - name: Lint (Ruff)
        run: |
          python -m ruff check \
            backend_app \
            scripts \
            tests \
            --select E9,F63,F7,F82

      - name: Duplication Check (JSCPD <= 1%)
        run: |
          npx -y jscpd@4.0.5 \
            --min-lines 20 \
            --min-tokens 120 \
            --threshold 1 \
            --reporters console \
            --ignore "**/__pycache__/**,**/.git/**,**/.venv/**,**/venv/**,**/.pytest_cache/**" \
            backend_app tests

      - name: Type Check (Mypy)
        run: |
          python -m mypy --ignore-missing-imports --follow-imports=skip \
            scripts \
            backend_app/config.py \
            backend_app/worker.py \
            backend_app/run_api.py \
            backend_app/path_setup.py

      - name: RBAC Regression Gate
        run: |
          python -m pytest -q \
            tests/test_crud_authorization.py \
            tests/test_rbac_permissions.py \
            tests/test_alignment_dag.py

      - name: Python Test Suite
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=pytest-results.xml || {
            echo "Initial pytest run failed. Re-running with verbose diagnostics..."
            python -m pytest -vv -ra --tb=long --full-trace --durations=50 --maxfail=1
            exit 1
          }

      - name: Upload Pytest Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: ignore

  spa-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            spa-bff/package-lock.json
            spa-web/package-lock.json

      - name: Install SPA BFF dependencies
        run: npm ci --prefix spa-bff

      - name: Install SPA Web dependencies
        run: npm ci --prefix spa-web

      - name: SPA BFF tests
        run: npm --prefix spa-bff test

      - name: SPA BFF build
        run: npm --prefix spa-bff run build

      - name: SPA Web build
        run: npm --prefix spa-web run build

      - name: SPA Web typecheck
        run: npm --prefix spa-web run typecheck

      - name: SPA Web tests
        run: npm --prefix spa-web test

      - name: SPA Web coverage gate
        run: npm --prefix spa-web run test:coverage

  spa-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - spa-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend_app/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend_app/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            spa-bff/package-lock.json
            spa-web/package-lock.json

      - name: Install SPA dependencies
        run: |
          npm ci --prefix spa-bff
          npm ci --prefix spa-web

      - name: Install Playwright Browser (Chromium)
        run: |
          set -o pipefail
          python -m playwright install chromium 2>&1 | tee playwright-install.log || {
            echo "Playwright browser install failed. Collecting diagnostics..."
            python --version || true
            python -m pip --version || true
            python -m pip show playwright || true
            python -m pip list | grep -i playwright || true
            uname -a || true
            exit 1
          }

      - name: SPA E2E Test (Playwright)
        env:
          OKR_RUN_PLAYWRIGHT_SPA_E2E: "1"
        run: |
          python -m pytest -q tests/test_e2e_playwright_spa_login_to_atlas.py --junitxml=pytest-spa-e2e-results.xml

      - name: Upload SPA E2E Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spa-e2e-results
          path: |
            pytest-spa-e2e-results.xml
            playwright-install.log
          if-no-files-found: ignore
