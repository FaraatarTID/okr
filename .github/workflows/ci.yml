name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            streamlit_app/requirements.txt
            streamlit_app/requirements-dev.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Docs HQ Link Check
        run: python scripts/check_docs_hq_links.py

      - name: Deploy Config Template Gate
        run: python scripts/check_deploy_config.py --mode template

      - name: Quality Baseline Expiry Gate
        run: python scripts/check_quality_gate_baseline.py

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r streamlit_app/requirements-dev.txt

      - name: Security Scan (pip-audit)
        run: |
          python -m pip_audit -r streamlit_app/requirements.txt --progress-spinner off

      - name: Lint (Ruff)
        run: |
          python -m ruff check \
            streamlit_app/src \
            backend_app \
            scripts \
            tests \
            --select E9,F63,F7,F82

      - name: Format Check (Ruff)
        run: |
          python -m ruff format --check \
            streamlit_app/src/crud.py \
            streamlit_app/src/utils/deadline_utils.py \
            streamlit_app/scripts/perf_hotpaths.py \
            tests/test_deadline_utils.py \
            tests/test_performance_hotpaths.py

      - name: Duplication Check (JSCPD <= 1%)
        run: |
          npx -y jscpd@4.0.5 \
            --min-lines 20 \
            --min-tokens 120 \
            --threshold 1 \
            --reporters console \
            --ignore "**/__pycache__/**,**/.git/**,**/.venv/**,**/venv/**,**/.pytest_cache/**" \
            streamlit_app backend_app tests

      - name: Type Check (Mypy)
        run: |
          python -m mypy --ignore-missing-imports --follow-imports=skip \
            streamlit_app/src/utils \
            scripts \
            streamlit_app/src/ui/app_entry_helpers.py \
            streamlit_app/src/ui/session_keys.py \
            backend_app/config.py \
            backend_app/worker.py \
            backend_app/run_api.py \
            backend_app/path_setup.py

      - name: RBAC Regression Gate
        run: |
          python -m pytest -q \
            tests/test_crud_authorization.py \
            tests/test_rbac_permissions.py \
            tests/test_alignment_dag.py

      - name: Session-State Governance Gate
        run: |
          python -m pytest -q \
            tests/test_session_keys_policy.py \
            tests/test_app_entry_helpers.py::test_record_rerun_metrics_warns_once_per_window \
            tests/test_app_entry_helpers.py::test_record_rerun_metrics_window_reset_allows_new_warning

      - name: Test
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=pytest-results.xml || {
            echo "Initial pytest run failed. Re-running with verbose diagnostics..."
            python -m pytest -vv -ra --tb=long --full-trace --durations=50 --maxfail=1
            exit 1
          }

      - name: Install Playwright Browser (Chromium)
        run: |
          set -o pipefail
          python -m playwright install chromium 2>&1 | tee playwright-install.log || {
            echo "Playwright browser install failed. Collecting diagnostics..."
            python --version || true
            python -m pip --version || true
            python -m pip show playwright || true
            python -m pip list | grep -i playwright || true
            uname -a || true
            exit 1
          }

      - name: E2E Test (Playwright)
        env:
          OKR_RUN_PLAYWRIGHT_E2E: "1"
        run: |
          python -m pytest -q tests/test_e2e_playwright_login_to_atlas.py --junitxml=pytest-e2e-results.xml

      - name: Upload Pytest Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: |
            pytest-results.xml
            pytest-e2e-results.xml
            playwright-install.log
          if-no-files-found: ignore
