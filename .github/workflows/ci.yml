name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Docs HQ Link Check
        run: python scripts/check_docs_hq_links.py

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r streamlit_app/requirements.txt
          pip install ruff mypy pytest

      - name: Security Scan (pip-audit)
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r streamlit_app/requirements.txt --progress-spinner off

      - name: Lint (Ruff)
        run: |
          python -m ruff check \
            streamlit_app/src/crud.py \
            streamlit_app/src/utils/deadline_utils.py \
            streamlit_app/scripts/perf_hotpaths.py \
            tests/test_deadline_utils.py \
            tests/test_performance_hotpaths.py \
            --select E9,F63,F7,F82

      - name: Format Check (Ruff)
        run: |
          python -m ruff format --check \
            streamlit_app/src/crud.py \
            streamlit_app/src/utils/deadline_utils.py \
            streamlit_app/scripts/perf_hotpaths.py \
            tests/test_deadline_utils.py \
            tests/test_performance_hotpaths.py

      - name: Type Check (Mypy)
        run: |
          python -m mypy --ignore-missing-imports --follow-imports=skip \
            streamlit_app/src/utils/deadline_utils.py \
            streamlit_app/scripts/perf_hotpaths.py

      - name: RBAC Regression Gate
        run: |
          python -m pytest -q \
            tests/test_crud_authorization.py \
            tests/test_rbac_permissions.py \
            tests/test_alignment_dag.py

      - name: Test
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=pytest-results.xml || {
            echo "Initial pytest run failed. Re-running with verbose diagnostics..."
            python -m pytest -vv -ra --tb=long --full-trace --durations=50 --maxfail=1
            exit 1
          }

      - name: Upload Pytest Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: ignore
