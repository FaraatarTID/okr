name: Publish release images to GHCR

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'README.md'
      - 'DEPLOYMENT.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ghcr-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.sha }}

jobs:
  publish:
    name: Publish ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: web
            context: .
            dockerfile: spa-web/Dockerfile
          - name: bff
            context: .
            dockerfile: spa-bff/Dockerfile
          - name: backend
            context: .
            dockerfile: deploy/docker/Dockerfile
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image namespace
        id: meta
        shell: bash
        run: echo "namespace=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Publish immutable image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.namespace }}/${{ matrix.name }}:${{ env.RELEASE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.title=OKR ${{ matrix.name }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=ghcr-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ matrix.name }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign published image digest
        env:
          IMAGE_NAME: ghcr.io/${{ steps.meta.outputs.namespace }}/${{ matrix.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Write image digest fragment
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ steps.meta.outputs.namespace }}/${{ matrix.name }}:${{ env.RELEASE_SHA }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p release-fragments
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          name = os.environ["IMAGE_NAME"].rsplit("/", 1)[-1].split(":", 1)[0]
          fragment = {
              "name": name,
              "image": os.environ["IMAGE_NAME"],
              "digest": os.environ["IMAGE_DIGEST"],
              "commit_sha": os.environ["RELEASE_SHA"],
          }
          Path("release-fragments", f"{name}.json").write_text(
              json.dumps(fragment, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload image digest fragment
        uses: actions/upload-artifact@v7
        with:
          name: ghcr-image-${{ matrix.name }}
          path: release-fragments/${{ matrix.name }}.json
          retention-days: 30

  manifest:
    name: Assemble release manifest
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6

      - name: Download image digest fragments
        uses: actions/download-artifact@v7
        with:
          pattern: ghcr-image-*
          path: release-fragments
          merge-multiple: true

      - name: Create release manifest
        run: |
          python scripts/create_release_manifest.py \
            --fragments release-fragments \
            --output release-manifest.json \
            --repository "${GITHUB_REPOSITORY}" \
            --commit-sha "${GITHUB_SHA}"

      - name: Upload release manifest
        uses: actions/upload-artifact@v7
        with:
          name: ghcr-release-manifest-${{ github.sha }}
          path: release-manifest.json
          retention-days: 90
