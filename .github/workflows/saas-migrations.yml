name: Migrate SaaS tenant databases

on:
  workflow_dispatch:
    inputs:
      max_retries:
        description: Non-negative retries per tenant after a failed migration
        required: false
        default: "1"
      canary_tenants:
        description: Comma-separated canary tenant environment IDs (first wave)
        required: false
        default: ""
      max_concurrency:
        description: Bounded migrations per later wave; 1 keeps sequential execution
        required: false
        default: "1"
      batch_size:
        description: Tenant count in each post-canary wave; 0 puts all remaining tenants in one bounded wave
        required: false
        default: "0"
      health_probe_mode:
        description: Readiness probe policy (off, optional, or required)
        required: false
        type: choice
        options: [off, optional, required]
        default: optional
      production_confirmation:
        description: Type MIGRATE_PRODUCTION to confirm this production migration
        required: true
        default: ""
      continue_on_wave_failure:
        description: Continue later waves after a failed wave (emergency override)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrate:
    name: Run tenant migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python dependencies
        run: uv sync --locked --group dev

      - name: Materialize migration inputs
        env:
          SAAS_PROVISIONING_STATE_JSON: ${{ secrets.SAAS_PROVISIONING_STATE_JSON }}
          SAAS_DATABASE_URLS_JSON: ${{ secrets.SAAS_DATABASE_URLS_JSON }}
          SAAS_READINESS_URLS_JSON: ${{ secrets.SAAS_READINESS_URLS_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${SAAS_PROVISIONING_STATE_JSON:-}" ]; then
            echo "Missing required secret: SAAS_PROVISIONING_STATE_JSON"
            exit 1
          fi
          if [ -z "${SAAS_DATABASE_URLS_JSON:-}" ]; then
            echo "Missing required secret: SAAS_DATABASE_URLS_JSON"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/okr-migrations"
          printf '%s' "$SAAS_PROVISIONING_STATE_JSON" > "$RUNNER_TEMP/okr-migrations/environments.json"
          printf '%s' "$SAAS_DATABASE_URLS_JSON" > "$RUNNER_TEMP/okr-migrations/database-urls.json"
          python -m json.tool "$RUNNER_TEMP/okr-migrations/environments.json" >/dev/null
          python -m json.tool "$RUNNER_TEMP/okr-migrations/database-urls.json" >/dev/null
          if [ -n "${SAAS_READINESS_URLS_JSON:-}" ]; then
            printf '%s' "$SAAS_READINESS_URLS_JSON" > "$RUNNER_TEMP/okr-migrations/readiness-urls.json"
            python -m json.tool "$RUNNER_TEMP/okr-migrations/readiness-urls.json" >/dev/null
          fi

      - name: Confirm production migration
        run: |
          test "${{ inputs.production_confirmation }}" = "MIGRATE_PRODUCTION" || {
            echo "Production migration requires production_confirmation=MIGRATE_PRODUCTION" >&2
            exit 1
          }

      - name: Migrate provisioned tenants in controlled waves
        run: |
          set -euo pipefail
          args=(
            --provisioning-state-file "$RUNNER_TEMP/okr-migrations/environments.json"
            --database-urls-file "$RUNNER_TEMP/okr-migrations/database-urls.json"
            --max-retries "${{ inputs.max_retries }}"
            --max-concurrency "${{ inputs.max_concurrency }}"
            --batch-size "${{ inputs.batch_size }}"
            --health-probe-mode "${{ inputs.health_probe_mode }}"
            --release-id "${{ github.run_id }}"
            --migration-artifact "${{ github.sha }}"
            --output migration-report.json
          )
          IFS=',' read -ra canaries <<< "${{ inputs.canary_tenants }}"
          for tenant in "${canaries[@]}"; do [ -n "$tenant" ] && args+=(--canary-tenant "$tenant"); done
          if [ -f "$RUNNER_TEMP/okr-migrations/readiness-urls.json" ]; then args+=(--readiness-urls-file "$RUNNER_TEMP/okr-migrations/readiness-urls.json"); fi
          if [ "${{ inputs.continue_on_wave_failure }}" = "true" ]; then args+=(--continue-on-wave-failure); fi
          uv run python scripts/migrate_tenant_databases.py "${args[@]}"

      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: saas-migration-report-${{ github.run_id }}
          path: migration-report.json
          if-no-files-found: warn
