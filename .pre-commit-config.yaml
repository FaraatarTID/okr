exclude: |
  (?x)^(
    android/\.idea/|
    android/.*/build/|
    android/app/src/main/assets/public/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: \.(md|ya?ml)$
      - id: end-of-file-fixer
        files: \.(md|ya?ml)$
      - id: mixed-line-ending
        args: [--fix=lf]
        files: \.(py|md|txt|toml|ya?ml|json|ini|cfg|sh|sql|css|js|ts|tsx|html|xml)$
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: docs-hq-link-check
        name: Documentation HQ link check
        entry: python scripts/check_docs_hq_links.py
        language: system
        pass_filenames: false
        always_run: true

      - id: quality-baseline-expiry-check
        name: Quality baseline expiry check
        entry: python scripts/check_quality_gate_baseline.py
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-check-critical-repo
        name: Ruff check (repo critical)
        entry: python -m ruff check backend_app scripts tests --select E9,F63,F7,F82
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format-check-targeted
        name: Ruff format check (targeted)
        entry: python -m ruff format --check tests/test_deadline_utils.py tests/test_performance_hotpaths.py
        language: system
        pass_filenames: false
        always_run: true

      - id: secret-hygiene-check
        name: Secret hygiene check
        entry: python scripts/verify_secret_hygiene.py
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy-check-expanded
        name: Mypy check (expanded)
        entry: python -m mypy --ignore-missing-imports --follow-imports=skip scripts backend_app/config.py backend_app/worker.py backend_app/run_api.py backend_app/path_setup.py
        language: system
        pass_filenames: false
        always_run: true
