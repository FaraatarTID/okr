; Test-only topology. Both clients and PgBouncer run inside disposable CI/local Docker.
[databases]
* = host=postgres port=5432 user=okr password=okr

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = any
pool_mode = transaction
; Strict on purpose: with the default (200) PgBouncer transparently supports protocol-level
; prepared statements and would hide a regression of prepare_threshold=None in src/db_url.py.
; 0 is what a pooler without support (PgBouncer < 1.21, or this setting off) does.
max_prepared_statements = 0
default_pool_size = 2
max_client_conn = 50
admin_users = okr
stats_users = okr
ignore_startup_parameters = extra_float_digits
log_connections = 0
log_disconnections = 0
