; Test-only topology. Both clients and PgBouncer run inside disposable CI/local Docker.
[databases]
* = host=postgres port=5432 user=okr password=okr

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = any
pool_mode = transaction
default_pool_size = 2
max_client_conn = 50
admin_users = okr
stats_users = okr
ignore_startup_parameters = extra_float_digits
log_connections = 0
log_disconnections = 0
