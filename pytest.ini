[pytest]
testpaths =
    tests
norecursedirs =
    .git
    .venv
    venv
    node_modules
    __pycache__
    .pytest_cache
    .mypy_cache
    .ruff_cache
    tmp
    logs
markers =
    e2e: browser or full-stack end-to-end coverage requiring running services
    integration: coverage requiring an external service or production-like runtime
    postgres: coverage requiring PostgreSQL rather than SQLite
    smoke: opt-in full-stack smoke coverage
