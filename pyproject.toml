[project]
name = "okr-platform"
version = "0.1.0"
description = "OKR platform backend and service tooling workspace"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.18.4",
    "bcrypt==5.0.0",
    "fastapi==0.138.0",
    "google-genai==1.61.0",
    "httpx==0.28.1",
    "playwright==1.60.0",
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "redis==5.2.1",
    "requests==2.32.5",
    "sqlalchemy==2.0.46",
    "sqlmodel==0.0.32",
    "typing-extensions==4.15.0",
    "uvicorn==0.38.0",
]

[dependency-groups]
dev = [
    "mypy==1.15.0",
    "pytest==8.4.0",
    "ruff==0.11.13",
]

[tool.uv]
# The repository currently uses a flat application layout rather than a
# distributable Python package. uv still provides one authoritative resolver.
package = false

[tool.ruff]
# Applied migrations are immutable. Reformatting one rewrites its bytes without
# changing its meaning, which defeats the reason they are frozen, so they are
# excluded from the repo-wide format check instead of being silently reformatted.
# This is the only path-level carve-out in the gate; everything else is formatted.
extend-exclude = ["alembic/versions"]

[tool.ruff.format]
# `.gitattributes` declares `*.py text eol=lf`, so the emitted line ending must not
# depend on the host platform. Ruff's `auto` default preserved whatever it found and
# wrote CRLF on Windows, and `ruff format --check` did not report that as a
# difference, so the gate could pass while producing files the attribute forbids.
line-ending = "lf"
