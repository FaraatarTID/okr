[project]
name = "okr-platform"
version = "0.1.0"
description = "OKR platform backend and service tooling workspace"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.18.4",
    "bcrypt==5.0.0",
    "cryptography==50.0.1",
    "fastapi==0.138.0",
    "google-genai==1.61.0",
    "httpx==0.28.1",
    "psycopg==3.3.6",
    # Equivalent to psycopg[binary]; the two are pinned to the same version by hand because the
    # manifest tooling only understands plain name==version pins. psycopg-binary must move with psycopg.
    "psycopg-binary==3.3.6",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "redis==5.2.1",
    "requests==2.32.5",
    "sqlalchemy==2.0.46",
    "sqlmodel==0.0.32",
    "typing-extensions==4.15.0",
    "uvicorn==0.38.0",
]

[dependency-groups]
# Headless Chromium: the PDF_METHOD=chromium renderer (src/services/pdf_service.py) and the
# Playwright E2E tests. Not a runtime dependency: pdf_service treats a missing import as
# "renderer unavailable". `dev` includes it, so CI's `uv sync --group dev` is unchanged; the
# backend image leaves it out unless built with INSTALL_BROWSER_GROUP=true.
browser = [
    "playwright==1.60.0",
]
dev = [
    {include-group = "browser"},
    "mypy==1.15.0",
    "pytest==8.4.0",
    "PyYAML==6.0.3",
    "ruff==0.11.13",
]

[tool.uv]
# The repository currently uses a flat application layout rather than a
# distributable Python package. uv still provides one authoritative resolver.
package = false

[tool.ruff]
# Applied migrations are immutable. Reformatting one rewrites its bytes without
# changing its meaning, which defeats the reason they are frozen, so they are
# excluded from the repo-wide format check instead of being silently reformatted.
# This is the only path-level carve-out in the gate; everything else is formatted.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Defaults (E4, E7, E9, F) stay on; BLE (blind except) and S (bandit) are added.
extend-select = ["BLE", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use throwaway literals and spawn subprocesses on purpose.
"tests/**" = ["S"]
# BASELINE, not approval. Each file below already had a finding when the rules were
# enabled. tests/test_ruff_baseline.py compares per-file counts with tests/ruff_baseline.json,
# so a NEW finding in a listed file fails the suite and a fixed one must be removed from the
# baseline. Files not listed are checked in full. See docs/ruff-baseline.md.
"alembic/env.py" = ["BLE001", "S110"]
