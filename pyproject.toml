[tool.ruff.format]
# `.gitattributes` declares `*.py text eol=lf`, so the emitted line ending must not
# depend on the host platform. Ruff's `auto` default preserved whatever it found and
# wrote CRLF on Windows, and `ruff format --check` did not report that as a
# difference, so the gate could pass while producing files the attribute forbids.
line-ending = "lf"
