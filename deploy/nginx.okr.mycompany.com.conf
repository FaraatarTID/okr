# Nginx vhost template for production deployment at:
# https://okr.mycompany.com
#
# Usage:
# 1) Copy to /etc/nginx/sites-available/okr.conf
# 2) Enable via symlink to /etc/nginx/sites-enabled/okr.conf
# 3) Run: nginx -t && systemctl reload nginx
#
# If certs are not ready yet, start with only the port-80 block and
# comment out the 443 block until certificates are installed.

server {
    listen 80;
    listen [::]:80;
    server_name okr.mycompany.com;

    # Redirect all HTTP traffic to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name okr.mycompany.com;

    # Replace with your certificate paths (Certbot/internal PKI).
    ssl_certificate /etc/letsencrypt/live/okr.mycompany.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/okr.mycompany.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Baseline hardening headers.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;

        # Required headers for websocket upgrade path.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long-lived interactions.
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
