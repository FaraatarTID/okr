x-release-images:
  backend: &release-backend-image ${OKR_RELEASE_BACKEND_IMAGE:-${IMAGE:-okr-backend:local}}
  bff: &release-bff-image ${OKR_RELEASE_BFF_IMAGE:-${SPA_BFF_IMAGE:-okr-spa-bff:local}}
  web: &release-web-image ${OKR_RELEASE_WEB_IMAGE:-${SPA_WEB_IMAGE:-okr-spa-web:local}}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${OKR_POSTGRES_USER:-okr}
      - POSTGRES_PASSWORD=${OKR_POSTGRES_PASSWORD:-okr_dev_password}
      - POSTGRES_DB=${OKR_POSTGRES_DB:-okr}
    ports:
      - "${OKR_POSTGRES_BIND_ADDRESS:-127.0.0.1}:${OKR_POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - okr-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OKR_POSTGRES_USER:-okr}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend-api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: *release-backend-image
    environment:
      - OKR_DATABASE_URL=${OKR_DATABASE_URL-postgresql+psycopg2://okr:okr_dev_password@postgres:5432/okr}
      - OKR_DATA_ACCESS_MODE=${OKR_DATA_ACCESS_MODE-database}
      - OKR_DEPLOYMENT_PROFILE=${OKR_DEPLOYMENT_PROFILE-on_premise}
      - OKR_CONTROL_PLANE_STATE_PATH=${OKR_CONTROL_PLANE_STATE_PATH-/var/lib/okr/saas-control-plane.json}
      - OKR_RELEASE_VERSION=${OKR_RELEASE_VERSION:-local}
      - OKR_RELEASE_ARTIFACT=${OKR_RELEASE_ARTIFACT:-local}
      - OKR_SAAS_MODE=${OKR_SAAS_MODE-false}
      - OKR_ENVIRONMENT_ID=${OKR_ENVIRONMENT_ID:-}
      - OKR_CUSTOMER_ID=${OKR_CUSTOMER_ID:-}
      - OKR_HEALTH_URL=${OKR_HEALTH_URL:-/healthz}
      - OKR_BACKUP_PROVIDER=${OKR_BACKUP_PROVIDER:-deferred}
      - OKR_BACKUP_SCHEDULE=${OKR_BACKUP_SCHEDULE:-deferred}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - OKR_BACKEND_HOST=0.0.0.0
      - OKR_BACKEND_PORT=${OKR_BACKEND_PORT:-8100}
      - OKR_BACKEND_SERVICE_TOKEN=${OKR_BACKEND_SERVICE_TOKEN:?OKR_BACKEND_SERVICE_TOKEN must be set}
      - OKR_BOOTSTRAP_ADMIN_PASSWORD=${OKR_BOOTSTRAP_ADMIN_PASSWORD:-}
      - OKR_BACKEND_ENFORCE_TOKEN=${OKR_BACKEND_ENFORCE_TOKEN:-true}
      - OKR_BACKEND_SIGNING_SECRET=${OKR_BACKEND_SIGNING_SECRET:?OKR_BACKEND_SIGNING_SECRET must be set}
      - OKR_BACKEND_ENFORCE_REQUEST_SIGNING=${OKR_BACKEND_ENFORCE_REQUEST_SIGNING:-true}
      - OKR_BACKEND_SECURITY_STATE_BACKEND=${OKR_BACKEND_SECURITY_STATE_BACKEND:-database}
      - OKR_BACKEND_SECURITY_STATE_REDIS_URL=${OKR_BACKEND_SECURITY_STATE_REDIS_URL:-}
      - OKR_BACKEND_SECURITY_STATE_REDIS_PREFIX=${OKR_BACKEND_SECURITY_STATE_REDIS_PREFIX:-okr:security}
      - OKR_BACKEND_JOB_USER_WINDOW_SECONDS=${OKR_BACKEND_JOB_USER_WINDOW_SECONDS:-60}
      - OKR_BACKEND_JOB_USER_MAX_REQUESTS=${OKR_BACKEND_JOB_USER_MAX_REQUESTS:-8}
      - OKR_BACKEND_JOB_USER_DAILY_MAX_REQUESTS=${OKR_BACKEND_JOB_USER_DAILY_MAX_REQUESTS:-200}
      - OKR_BACKEND_JOB_TEAM_WINDOW_SECONDS=${OKR_BACKEND_JOB_TEAM_WINDOW_SECONDS:-60}
      - OKR_BACKEND_JOB_TEAM_MAX_REQUESTS=${OKR_BACKEND_JOB_TEAM_MAX_REQUESTS:-60}
      - OKR_BACKEND_JOB_TEAM_DAILY_MAX_REQUESTS=${OKR_BACKEND_JOB_TEAM_DAILY_MAX_REQUESTS:-1200}
      - ALLOW_EXTERNAL_AI=${ALLOW_EXTERNAL_AI:-false}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-latest}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - PDF_METHOD=${PDF_METHOD:-pdfshift}
      - PDFSHIFT_API_KEY=${PDFSHIFT_API_KEY:-}
    command: ["sh", "-c", "case \"$$(printf '%s' \"$$OKR_SAAS_MODE\" | tr '[:upper:]' '[:lower:]')\" in true|1|yes|on) SaaS=1 ;; *) SaaS=0 ;; esac; if [ \"$$SaaS\" = \"1\" ] || [ \"$$OKR_DEPLOYMENT_PROFILE\" = \"single_tenant_saas\" ]; then python scripts/check_deploy_config.py --mode runtime --saas-only --environment || exit $$?; fi; exec python -m backend_app.run_api"]
    ports:
      - "${OKR_BACKEND_BIND_ADDRESS:-127.0.0.1}:${OKR_BACKEND_HOST_PORT:-8100}:${OKR_BACKEND_PORT:-8100}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${OKR_BACKEND_PORT:-8100}/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    restart: unless-stopped
    volumes:
      - okr-control-plane-state:/var/lib/okr
    depends_on:
      postgres:
        condition: service_healthy

  backend-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: *release-backend-image
    environment:
      - OKR_DATABASE_URL=${OKR_DATABASE_URL-postgresql+psycopg2://okr:okr_dev_password@postgres:5432/okr}
      - OKR_DATA_ACCESS_MODE=${OKR_DATA_ACCESS_MODE-database}
      - OKR_DEPLOYMENT_PROFILE=${OKR_DEPLOYMENT_PROFILE-on_premise}
      - OKR_CONTROL_PLANE_STATE_PATH=${OKR_CONTROL_PLANE_STATE_PATH-/var/lib/okr/saas-control-plane.json}
      - OKR_RELEASE_VERSION=${OKR_RELEASE_VERSION:-local}
      - OKR_RELEASE_ARTIFACT=${OKR_RELEASE_ARTIFACT:-local}
      - OKR_SAAS_MODE=${OKR_SAAS_MODE-false}
      - OKR_ENVIRONMENT_ID=${OKR_ENVIRONMENT_ID:-}
      - OKR_CUSTOMER_ID=${OKR_CUSTOMER_ID:-}
      - OKR_HEALTH_URL=${OKR_HEALTH_URL:-/healthz}
      - OKR_BACKUP_PROVIDER=${OKR_BACKUP_PROVIDER:-deferred}
      - OKR_BACKUP_SCHEDULE=${OKR_BACKUP_SCHEDULE:-deferred}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - OKR_BACKEND_WORKER_POLL_SECONDS=${OKR_BACKEND_WORKER_POLL_SECONDS:-2}
      - OKR_BACKEND_SERVICE_TOKEN=${OKR_BACKEND_SERVICE_TOKEN:?OKR_BACKEND_SERVICE_TOKEN must be set}
      - OKR_BACKEND_ENFORCE_TOKEN=${OKR_BACKEND_ENFORCE_TOKEN:-true}
      - ALLOW_EXTERNAL_AI=${ALLOW_EXTERNAL_AI:-false}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-latest}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - PDF_METHOD=${PDF_METHOD:-pdfshift}
      - PDFSHIFT_API_KEY=${PDFSHIFT_API_KEY:-}
    command: ["sh", "-c", "case \"$$(printf '%s' \"$$OKR_SAAS_MODE\" | tr '[:upper:]' '[:lower:]')\" in true|1|yes|on) SaaS=1 ;; *) SaaS=0 ;; esac; if [ \"$$SaaS\" = \"1\" ] || [ \"$$OKR_DEPLOYMENT_PROFILE\" = \"single_tenant_saas\" ]; then python scripts/check_deploy_config.py --mode runtime --saas-only --environment || exit $$?; fi; exec python -m backend_app.worker"]
    restart: unless-stopped
    healthcheck:
      disable: true
    volumes:
      - okr-control-plane-state:/var/lib/okr
    depends_on:
      postgres:
        condition: service_healthy
      backend-api:
        condition: service_healthy

  spa-bff:
    build:
      context: ../..
      dockerfile: spa-bff/Dockerfile
    image: *release-bff-image
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - BFF_HOST=0.0.0.0
      - BFF_PORT=${BFF_PORT:-3001}
      - OKR_DEPLOYMENT_PROFILE=${OKR_DEPLOYMENT_PROFILE-on_premise}
      - OKR_RELEASE_VERSION=${OKR_RELEASE_VERSION:-local}
      - OKR_RELEASE_ARTIFACT=${OKR_RELEASE_ARTIFACT:-local}
      - OKR_SAAS_MODE=${OKR_SAAS_MODE-false}
      - OKR_ENVIRONMENT_ID=${OKR_ENVIRONMENT_ID:-}
      - OKR_CUSTOMER_ID=${OKR_CUSTOMER_ID:-}
      - BFF_REQUEST_TIMEOUT_MS=${BFF_REQUEST_TIMEOUT_MS:-20000}
      - BFF_SESSION_SECRET=${BFF_SESSION_SECRET:?BFF_SESSION_SECRET must be set}
      - BFF_SESSION_TTL_SECONDS=${BFF_SESSION_TTL_SECONDS:-28800}
      - BFF_COOKIE_SECURE=${BFF_COOKIE_SECURE:-true}
      - OKR_BACKEND_API_URL=${OKR_BACKEND_API_URL:-http://backend-api:8100}
      - OKR_BACKEND_SERVICE_TOKEN=${OKR_BACKEND_SERVICE_TOKEN:?OKR_BACKEND_SERVICE_TOKEN must be set}
      - OKR_BACKEND_SIGNING_SECRET=${OKR_BACKEND_SIGNING_SECRET:?OKR_BACKEND_SIGNING_SECRET must be set}
      - BFF_LOG_LEVEL=${BFF_LOG_LEVEL:-info}
    ports:
      - "${SPA_BFF_BIND_ADDRESS:-127.0.0.1}:${SPA_BFF_HOST_PORT:-3001}:${BFF_PORT:-3001}"
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:${BFF_PORT:-3001}/healthz >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  spa-web:
    build:
      context: ../..
      dockerfile: spa-web/Dockerfile
    image: *release-web-image
    environment:
      - PORT=3000
      - OKR_DEPLOYMENT_PROFILE=${OKR_DEPLOYMENT_PROFILE-on_premise}
      - OKR_RELEASE_VERSION=${OKR_RELEASE_VERSION:-local}
      - OKR_RELEASE_ARTIFACT=${OKR_RELEASE_ARTIFACT:-local}
      - OKR_SAAS_MODE=${OKR_SAAS_MODE-false}
      - OKR_ENVIRONMENT_ID=${OKR_ENVIRONMENT_ID:-}
      - OKR_CUSTOMER_ID=${OKR_CUSTOMER_ID:-}
      - BFF_PUBLIC_ORIGIN=${BFF_PUBLIC_ORIGIN:-http://spa-bff:3001}
      - NEXT_PUBLIC_OKR_AI_SYNC_MAX_DELTA=${NEXT_PUBLIC_OKR_AI_SYNC_MAX_DELTA:-100}
      - NEXT_PUBLIC_OKR_AI_SYNC_ALLOW_DECREASE=${NEXT_PUBLIC_OKR_AI_SYNC_ALLOW_DECREASE:-true}
    ports:
      - "${SPA_WEB_BIND_ADDRESS:-127.0.0.1}:${SPA_WEB_HOST_PORT:-3000}:3000"
    depends_on:
      spa-bff:
        condition: service_healthy
    restart: unless-stopped

volumes:
  okr-postgres-data:
  okr-control-plane-state:
