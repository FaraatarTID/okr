version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: okr-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-okr}
      - POSTGRES_USER=${POSTGRES_USER:-okr}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-okrpass}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${PG_HOST_PORT:-5432}:5432"
    restart: unless-stopped

  okr:
    # Use the app service from the base compose; override env to use Postgres
    environment:
      - OKR_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-okr}:${POSTGRES_PASSWORD:-okrpass}@postgres:5432/${POSTGRES_DB:-okr}
    depends_on:
      - postgres

volumes:
  pg_data:
