# Example Nginx reverse proxy for OKR app
# Adjust server_name, TLS, and upstream ports as needed.

# Option A: Dedicated subdomain (recommended)
server {
    listen 80;
    server_name okr.example.com;

    # If using TLS with certbot, replace this server block with the HTTPS version

    location / {
        proxy_pass http://127.0.0.1:3000/;  # spa-web container published port
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}

