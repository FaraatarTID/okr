apiVersion: apps/v1
kind: Deployment
metadata:
  name: okr-backend-api
  namespace: okr
  labels:
    app: okr-backend-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: okr-backend-api
  template:
    metadata:
      labels:
        app: okr-backend-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: backend-api
          image: ghcr.io/your-org/okr-streamlit:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "backend_app.run_api"]
          ports:
            - containerPort: 8100
          env:
            - name: OKR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: okr-db
                  key: OKR_DATABASE_URL
            - name: OKR_BACKEND_HOST
              value: "0.0.0.0"
            - name: OKR_BACKEND_PORT
              value: "8100"
            - name: OKR_BACKEND_ENFORCE_TOKEN
              value: "true"
            - name: OKR_BACKEND_ENFORCE_REQUEST_SIGNING
              value: "true"
            - name: OKR_BACKEND_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: okr-backend-auth
                  key: OKR_BACKEND_SERVICE_TOKEN
            - name: OKR_BACKEND_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: okr-backend-auth
                  key: OKR_BACKEND_SIGNING_SECRET
            - name: OKR_BACKEND_SECURITY_STATE_BACKEND
              value: "database"
            - name: OKR_ALLOW_LOCAL_MUTATION_FALLBACK
              value: "false"
            - name: OKR_ALLOW_LOCAL_READ_FALLBACK
              value: "false"
            - name: OKR_BACKEND_JOB_RETENTION_DAYS
              value: "14"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8100
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8100
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
