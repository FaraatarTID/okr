apiVersion: apps/v1
kind: Deployment
metadata:
  name: okr-backend-worker
  namespace: okr
  labels:
    app: okr-backend-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: okr-backend-worker
  template:
    metadata:
      labels:
        app: okr-backend-worker
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: backend-worker
          # Replace the digest placeholder from the signed release manifest.
          image: ghcr.io/your-org/okr-backend-worker@sha256:REPLACE_WITH_RELEASE_DIGEST
          imagePullPolicy: Always
          command: ["python", "-m", "backend_app.worker"]
          livenessProbe:
            exec:
              command: ["python", "-m", "backend_app.worker_healthcheck"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["python", "-m", "backend_app.worker_healthcheck"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: OKR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: okr-db
                  key: OKR_DATABASE_URL
            - name: OKR_BACKEND_WORKER_POLL_SECONDS
              value: "2"
            - name: OKR_BACKEND_JOB_RETENTION_DAYS
              value: "14"
            - name: OKR_BACKEND_JOB_PRUNE_INTERVAL_SECONDS
              value: "300"
            - name: OKR_BACKEND_JOB_PRUNE_BATCH_SIZE
              value: "200"
            - name: OKR_ALLOW_LOCAL_MUTATION_FALLBACK
              value: "false"
            - name: OKR_ALLOW_LOCAL_READ_FALLBACK
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
