apiVersion: apps/v1
kind: Deployment
metadata:
  name: okr-streamlit
  namespace: okr
  labels:
    app: okr-streamlit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: okr-streamlit
  template:
    metadata:
      labels:
        app: okr-streamlit
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: app
          image: ghcr.io/your-org/okr-streamlit:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          env:
            - name: PORT
              value: "8501"
            - name: STREAMLIT_SERVER_HEADLESS
              value: "true"
            - name: BASE_URL_PATH
              value: "" # set to "okr" if serving under a subpath
            - name: OKR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: okr-db
                  key: OKR_DATABASE_URL
            - name: OKR_BACKEND_API_URL
              value: "http://okr-backend-api:8100"
            - name: OKR_BACKEND_PROXY_MUTATIONS
              value: "true"
            - name: OKR_BACKEND_PROXY_READS
              value: "true"
            - name: OKR_BACKEND_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: okr-backend-auth
                  key: OKR_BACKEND_SERVICE_TOKEN
            - name: OKR_BACKEND_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: okr-backend-auth
                  key: OKR_BACKEND_SIGNING_SECRET
            - name: OKR_ALLOW_LOCAL_MUTATION_FALLBACK
              value: "false"
            - name: OKR_ALLOW_LOCAL_READ_FALLBACK
              value: "false"
          readinessProbe:
            httpGet:
              path: /
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
