[mypy]
python_version = 3.11
show_error_codes = True
warn_unused_configs = True
ignore_missing_imports = True
exclude = ^alembic/versions/\d{0,}.+\.py$

[mypy-backend_app.jobs]
disable_error_code = arg-type

[mypy-backend_app.security_state]
disable_error_code = assignment,import-not-found

[mypy-src.domain.alignment]
disable_error_code = arg-type

[mypy-src.domain.analysis]
disable_error_code = arg-type

[mypy-src.domain.analytics]
disable_error_code = arg-type,call-overload

[mypy-src.domain.authorization]
disable_error_code = arg-type

[mypy-src.domain.progress]
disable_error_code = union-attr

[mypy-src.domain.read_queries]
disable_error_code = arg-type,call-overload,misc

[mypy-src.models]
disable_error_code = arg-type

[mypy-src.services.pdf_service]
disable_error_code = arg-type,assignment

[mypy-alembic]
disable_error_code = attr-defined,misc
